name: Weft

options:
  bundleIdPrefix: me.weishu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WeftKit:
    path: Packages/WeftKit

targets:
  Weft:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: WeftKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Weft
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Weft 需要读取当前浏览器标签页的网址，用来给你的时间分类。这些数据不会离开这台 Mac。
        NSHumanReadableCopyright: 基于 MIT 许可证开源。
        CFBundleURLTypes:
          - CFBundleURLName: me.weishu.Weft
            CFBundleURLSchemes: [weft]
    entitlements:
      path: App/Weft.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.weishu.Weft
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Weft:
    build:
      targets:
        Weft: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
